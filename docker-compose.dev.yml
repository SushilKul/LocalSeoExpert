version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/localseoexpert
      - JWT_SECRET=dev_jwt_secret
      - HOST=0.0.0.0
    depends_on:
      - db
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma db push &&
             npm run dev:server"

  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=localseoexpert
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
